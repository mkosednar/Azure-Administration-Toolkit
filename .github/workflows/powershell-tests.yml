name: PowerShell tests

on:
  push:
    branches: [ main, "improve/**" ]
  pull_request:
    branches: [ main ]

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Run parser and Pester tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI -Output Detailed
